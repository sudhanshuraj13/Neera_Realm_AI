[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-ats"
version = "0.1.0"
description = "NextGen ATS: High-performance 4-Tier semantic decision engine combining Laya ModernBERT System-1 models with dual-persona Recruiter Intelligence & Candidate Coaching."
readme = "README.md"
authors = [
    { name = "Atlas AI / Neera Realm AI Team" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Human Resources",
]
keywords = ["ats", "resume-scoring", "decision-model", "laya", "modernbert", "recruitment", "career-ai"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.2",
    "torch>=2.0.0",
    "transformers>=4.38.0",
]
laya = [
    "laya>=0.1.0",
    "torch>=2.1.0",
]
all = [
    "sentence-transformers>=2.2.2",
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "laya>=0.1.0",
    "langchain-core>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/sudhanshuraj13/nextGen_ATS"
Repository = "https://github.com/sudhanshuraj13/nextGen_ATS"

[tool.setuptools.packages.find]
where = ["."]
include = ["nextgen_ats*"]
